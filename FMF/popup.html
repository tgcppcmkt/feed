<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedly GPT Collector</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;width:330px;margin:0;padding:14px;color:#1f2937}
h1{font-size:16px;margin:0 0 8px}.count{font-size:36px;font-weight:750;line-height:1;margin:6px 0 2px}
.sub{font-size:11px;color:#6b7280;margin-bottom:12px}
button{width:100%;padding:10px;margin:5px 0;border:1px solid #d1d5db;border-radius:8px;background:#f9fafb;cursor:pointer;font-weight:700}
button:hover{background:#f3f4f6}.primary{background:#eef2ff;border-color:#c7d2fe}
.status{margin-top:10px;padding:8px;border-radius:8px;background:#f3f4f6;font-size:12px;line-height:1.45;min-height:34px}
.hint{font-size:11px;color:#6b7280;margin-top:9px;line-height:1.45}
</style></head>
<body>
<h1>Feedly GPT Collector v0.5.1</h1>
<div class="count" id="count">0</div><div class="sub">今回取得した記事</div>
<button class="primary" id="scan">スキャン</button>
<button id="exportTsv">TSVエクスポート</button>
<div class="status" id="status">初期化中...</div>
<div class="hint">この画面を開くたびに前回の取得データを自動クリアします。<br>TSV列：ID / source / published / title / summary / url</div>
<script src="popup.js"></script></body></html>
